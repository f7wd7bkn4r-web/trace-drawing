<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#111111"><title>TRACE — рисование через камеру</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#111;color:white;font:16px -apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden}#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#222}#overlay{position:absolute;top:50%;left:50%;max-width:none;transform:translate(-50%,-50%);width:65vw;opacity:.5;touch-action:none;user-select:none;-webkit-user-drag:none;display:none}header{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 18px 16px;background:linear-gradient(#111e,#1110);pointer-events:none}header strong{font-size:22px;letter-spacing:4px}header small{display:block;color:#bbb;margin-top:6px}footer{position:absolute;bottom:0;left:0;right:0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px);background:linear-gradient(#1110,#111e 25%);display:grid;gap:12px}.buttons{display:flex;gap:10px}button,.filebtn{border:1px solid #666;border-radius:13px;background:#242424;color:white;padding:13px 12px;font:inherit;text-align:center;flex:1;cursor:pointer}button.primary{background:#f3f3f3;color:#111;border-color:#f3f3f3}input[type=file]{display:none}input[type=range]{width:100%;accent-color:white}.control{display:flex;align-items:center;gap:12px;font-size:14px}.control label{width:116px;color:#ddd}.control output{width:34px;text-align:right;color:#ddd}#message{font-size:13px;color:#ddd;min-height:18px;line-height:1.3}.help{font-size:12px;color:#aaa}#overlay.locked{pointer-events:none}</style></head><body><video id="camera" autoplay muted playsinline></video><img id="overlay" alt="Ваш рисунок"><header><strong>TRACE</strong><small>Рисование через камеру · iPhone</small></header><footer><div id="message">Нажмите «Камера», затем выберите рисунок.</div><div class="buttons"><button class="primary" id="start">Камера</button><label class="filebtn" for="file">Выбрать рисунок</label><input id="file" type="file" accept="image/*"></div><div class="control"><label for="opacity">Прозрачность</label><input id="opacity" type="range" min="0" max="100" value="50"><output id="opacityValue">50%</output></div><div class="control"><label for="scale">Размер</label><input id="scale" type="range" min="20" max="250" value="100"><output id="scaleValue">100%</output></div><div class="buttons"><button id="lock">Закрепить рисунок</button><button id="reset">Сбросить</button></div><div class="help">Перемещайте рисунок пальцем, увеличивайте двумя пальцами. Телефон держите неподвижно над бумагой.</div></footer><script>(()=>{'use strict';const video=document.querySelector('#camera'),img=document.querySelector('#overlay'),msg=document.querySelector('#message'),opacity=document.querySelector('#opacity'),scale=document.querySelector('#scale');let stream=null,url=null,locked=false,x=0,y=0,pointers=new Map(),gesture=null;const say=t=>msg.textContent=t;const paint=()=>{img.style.left=`calc(50% + ${x}px)`;img.style.top=`calc(50% + ${y}px)`;img.style.width=`${65*Number(scale.value)/100}vw`;img.style.opacity=String(Number(opacity.value)/100);document.querySelector('#opacityValue').textContent=opacity.value+'%';document.querySelector('#scaleValue').textContent=scale.value+'%'};document.querySelector('#start').onclick=async()=>{if(!navigator.mediaDevices?.getUserMedia){say('Камера доступна только на HTTPS-сайте в Safari.');return}try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;await video.play();say('Камера включена. Выберите рисунок.')}catch(e){say('Не удалось включить камеру. Проверьте разрешение Safari и HTTPS.')}};document.querySelector('#file').onchange=e=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){say('Выберите изображение.');return}if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file);img.onload=()=>{img.style.display='block';x=0;y=0;scale.value=100;paint();say('Рисунок загружен. Настройте прозрачность и положение.')};img.onerror=()=>say('Не удалось открыть изображение. Попробуйте JPG или PNG.');img.src=url};opacity.oninput=paint;scale.oninput=paint;document.querySelector('#lock').onclick=()=>{locked=!locked;img.classList.toggle('locked',locked);document.querySelector('#lock').textContent=locked?'Разблокировать':'Закрепить рисунок';say(locked?'Положение рисунка закреплено.':'Рисунок можно перемещать.')};document.querySelector('#reset').onclick=()=>{x=0;y=0;scale.value=100;opacity.value=50;paint();say('Положение и настройки сброшены.')};img.addEventListener('pointerdown',e=>{if(locked)return;e.preventDefault();img.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});gesture=null});img.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)||locked)return;e.preventDefault();const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const pts=[...pointers.values()];if(pts.length===1){x+=e.clientX-prev.x;y+=e.clientY-prev.y;paint()}else if(pts.length===2){const dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);if(gesture){scale.value=Math.max(20,Math.min(250,Math.round(gesture.scale*dist/gesture.dist)));paint()}else gesture={dist,scale:Number(scale.value)}}});const end=e=>{pointers.delete(e.pointerId);gesture=null};img.addEventListener('pointerup',end);img.addEventListener('pointercancel',end);paint()})();</script></body></html>
